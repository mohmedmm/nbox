<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #080b11;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1a2336;
    }
    .logo-square {
      width: 14px;
      height: 14px;
      background: #00f0a0;
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(0, 240, 160, 0.4);
    }
    h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #00f0a0;
      letter-spacing: 0.5px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .setting-label {
      color: #94a3b8;
      font-weight: 500;
    }
    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #1a2336;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #f1f5f9;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00d984;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
      background-color: #080b11;
    }
    .range-container {
      margin-top: 10px;
      padding: 12px;
      background: #0e131f;
      border-radius: 8px;
      border: 1px solid #1a2336;
    }
    .range-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: #64748b;
    }
    .range-val {
      color: #00f0a0;
      font-weight: 700;
    }
    input[type=range] {
      width: 100%;
      accent-color: #00f0a0;
      cursor: pointer;
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo-square"></span>
    <h3>nbox Enhancer</h3>
  </div>

  <div class="setting-row">
    <span class="setting-label">Neural Enhancement</span>
    <label class="switch">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span class="setting-label">Show Video Watermark</span>
    <label class="switch">
      <input type="checkbox" id="toggle-watermark" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="range-container">
    <div class="range-header">
      <span>Clarity Level (Subtle)</span>
      <span class="range-val" id="sharpness-val">35%</span>
    </div>
    <input type="range" id="sharpness-slider" min="10" max="100" value="35" step="5">
  </div>

  <div class="footer">
    Subtle contrast-adaptive clarity active on YouTube and all video players.
  </div>

  <script src="popup.js"></script>
</body>
</html>
